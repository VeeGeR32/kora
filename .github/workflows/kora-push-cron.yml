name: Kora Push Cron (100% Cloud)

on:
  schedule:
    # Runs every 10 minutes in the cloud (no local PC needed)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger-push-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel /api/push-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "https://kora-plum-gamma.vercel.app/api/push-cron"
          else
            curl -fsS "https://kora-plum-gamma.vercel.app/api/push-cron"
          fi
